[package]
name = "r8125-vfio"
edition = "2024"
license = "GPL-2.0-only"
version = "0.1.0"
description = "Drive the RTL8125B nicd from Linux userspace through VFIO, against real hardware"

[dependencies]
l4h-host = { path = "../../host/l4h-host" }
l4h-netcore = { path = "../../host/l4h-netcore" }
l4h-virtio = { path = "../../host/l4h-virtio" }
libc = "0.2"

[profile.release]
debug-assertions = true
overflow-checks = true
