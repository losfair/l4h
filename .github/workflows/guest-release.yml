# Guest tags publish Linux and its matching SDK independently of the host.
name: guest-release
on:
  push:
    tags: ['guest-v*']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  LINUX_VERSION: 6.18.63
  L4H_LINUX_CC: ccache gcc
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 2G
  CARGO_TERM_COLOR: always
  L4H_GUEST_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
jobs:
  guest:
    name: Guest Linux and SDK (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    container:
      image: debian:trixie@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6
    steps:
      - name: Freeze Debian packages and install git
        run: |
          rm -f /etc/apt/sources.list.d/debian.sources
          cat > /etc/apt/sources.list <<'SOURCES'
          deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/20261114T000000Z/ trixie main
          deb [check-valid-until=no] http://snapshot.debian.org/archive/debian-security/20261114T000000Z/ trixie-security main
          SOURCES
          apt-get update -q
          apt-get install -y -q --no-install-recommends git ca-certificates
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: build/dl
          key: linux-${{ env.LINUX_VERSION }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: .ccache
          key: ccache-guest-release-${{ github.sha }}
          restore-keys: |
            ccache-guest-release-
            ccache-x86_64-
      - name: Set up
        run: tools/ci-setup.sh x86_64
      - name: Build guest artifacts
        run: tools/build-guest-release.sh
      - name: Verify independent guest rebuild
        run: tools/check-reproducible.sh --guest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: l4h-guest-x86_64
          path: |
            build/efi/l4h-guest-*.tar.xz
            build/efi/SHA256SUMS
      - name: Publish guest release
        if: startsWith(github.ref, 'refs/tags/guest-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apt-get install -y -q --no-install-recommends gh
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "l4h guest $GITHUB_REF_NAME" --generate-notes --latest=false \
              build/efi/l4h-guest-*.tar.xz build/efi/SHA256SUMS
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: logs-guest-release
          path: |
            build/linux-build.log
            build/reproducibility.*/rebuild.log
