# Build what l4h ships for x86_64 and keep it as workflow artifacts:
# - the UEFI applications, one per seL4 variant, with the guest kernel and
#   its module tree (tools/build-efi.sh);
# - l4h-bios-x86_64.tar.xz, the same for BIOS machines (tools/mkbios.sh);
# - l4h-debug-x86_64.tar.xz, the same build unstripped, for decoding fault
#   addresses and computing launch digests;
# - l4h-dom0-x86_64.tar.xz, the dom0 userspace tools (tools/build-dom0.sh);
# - l4h-attest.py, the verifier of attestation reports;
# - l4h-manual.pdf, the user manual, showing the tag it was built for.
# A pushed v* tag also publishes them, with their checksums, as a GitHub
# release.  aarch64 has no shipped artifacts yet (DESIGN.md §11).
name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # Must match tools/ci-setup.sh (cache key of the Linux tarball).
  LINUX_VERSION: 6.18.60
  L4H_LINUX_CC: ccache gcc
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 2G
  CARGO_TERM_COLOR: always

jobs:
  x86_64:
    name: Release artifacts (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    container:
      image: debian:trixie
    steps:
      - name: Install git
        run: apt-get update -q && apt-get install -y -q --no-install-recommends git ca-certificates
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          submodules: true
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: build/dl
          key: linux-${{ env.LINUX_VERSION }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: .ccache
          key: ccache-release-${{ github.sha }}
          restore-keys: |
            ccache-release-
            ccache-x86_64-
      - name: Set up
        run: tools/ci-setup.sh x86_64
      - name: Build the manual
        env:
          L4H_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          apt-get install -y -q --no-install-recommends \
              latexmk texlive-latex-recommended texlive-latex-extra texlive-pictures \
              lmodern texlive-fonts-recommended
          make -C docs/manual
      - name: Build
        # Release builds: no kernel assertions or debug syscalls, and the
        # host prints critical errors only.
        env:
          L4H_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          L4H_RELEASE=1 tools/build-efi.sh
          tools/build-dom0.sh
          cp tools/l4h-attest.py docs/manual/l4h-manual.pdf build/efi/
          cd build/efi && sha256sum l4h-*.efi l4h-*.tar.xz l4h-attest.py l4h-manual.pdf > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: l4h-x86_64
          path: |
            build/efi/l4h-*.efi
            build/efi/l4h-*.tar.xz
            build/efi/l4h-attest.py
            build/efi/l4h-manual.pdf
            build/efi/SHA256SUMS
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apt-get install -y -q --no-install-recommends gh
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "l4h $GITHUB_REF_NAME" --generate-notes \
              build/efi/l4h-generic.efi build/efi/l4h-xapic-nopcid.efi \
              build/efi/l4h-skim-xapic-nopcid.efi \
              build/efi/l4h-bios-x86_64.tar.xz \
              build/efi/l4h-dom0-x86_64.tar.xz build/efi/l4h-debug-x86_64.tar.xz \
              build/efi/l4h-attest.py build/efi/l4h-manual.pdf build/efi/SHA256SUMS
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: logs-release
          path: |
            build/efi/*.log
            docs/manual/*.log
