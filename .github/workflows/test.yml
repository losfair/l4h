  build-aarch64:
    name: aarch64 build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: debian:trixie
    env:
      L4H_ARCH: aarch64
      L4H_LINUX_CC: ccache aarch64-linux-gnu-gcc
    steps:
      - name: Install git
        run: apt-get update -q && apt-get install -y -q --no-install-recommends git ca-certificates
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: true
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: build/dl
          key: linux-${{ env.LINUX_VERSION }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .ccache
          key: ccache-aarch64-${{ github.sha }}
          restore-keys: ccache-aarch64-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-aarch64-${{ hashFiles('**/Cargo.lock', 'tools/ci-setup.sh') }}
          restore-keys: cargo-aarch64-
      - name: Set up
        run: tools/ci-setup.sh aarch64
      - name: Build seL4 and loader
        run: tools/build-kernel-aarch64.sh && tools/build-loader-aarch64.sh
      - name: IPC goes through the wiring and l4h-ipc (clippy)
        run: tests/check-ipc.sh
      - name: Build Linux, SDK, test modules, l4hctl and host
        run: |
          tools/build-linux.sh vmlinux modules
          tools/build-sdk.sh
          tools/build-test-modules.sh
          tools/build-l4hctl.sh
          tests/build-flagstest.sh
          tools/build-host-aarch64.sh
      - name: Pack prebuilt aarch64 stack (2 GiB and 6 GiB kernel/loader)
        run: |
          aarch64-linux-gnu-objcopy --strip-debug build/linux-l4h-aarch64/vmlinux build/linux-l4h-aarch64/vmlinux.stripped
          mkdir -p build/prebuilt
          cp host/target/aarch64-sel4-roottask/debug/l4h-root.elf build/prebuilt/l4h-root-default.elf
          L4H_TEST_INJECT=1 tools/build-host-aarch64.sh
          cp host/target/aarch64-sel4-roottask/debug/l4h-root.elf build/prebuilt/l4h-root-inject.elf
          cp build/prebuilt/l4h-root-default.elf host/target/aarch64-sel4-roottask/debug/l4h-root.elf
          stage=$(mktemp -d)
          mkdir -p "$stage/build/linux-l4h-aarch64/scripts/basic" "$stage/build/linux-l4h-aarch64/scripts/mod"
          cp build/linux-l4h-aarch64/vmlinux.stripped "$stage/build/linux-l4h-aarch64/vmlinux"
          cp build/linux-l4h-aarch64/vmlinux.stripped "$stage/build/linux-l4h-aarch64/vmlinux.stripped"
          cp build/linux-l4h-aarch64/sdk.erofs build/linux-l4h-aarch64/.config "$stage/build/linux-l4h-aarch64/"
          cp build/linux-l4h-aarch64/scripts/basic/fixdep "$stage/build/linux-l4h-aarch64/scripts/basic/"
          cp build/linux-l4h-aarch64/scripts/mod/modpost "$stage/build/linux-l4h-aarch64/scripts/mod/"
          tar -cf build/prebuilt-aarch64.tar \
            -C "$stage" build/linux-l4h-aarch64 \
            -C "$PWD" \
            build/sel4-aarch64 \
            build/kernel-aarch64/kernel.elf \
            build/loader-target/aarch64-unknown-none/release/sel4-kernel-loader \
            build/loader-target/release/sel4-kernel-loader-add-payload \
            build/guest/flags-test build/guest/flagsvm.cpio.gz \
            build/guest/page-aging/l4h_page_aging.ko \
            build/guest/pvlock/l4h_pvlock.ko \
            build/guest/bpf/test_bpf.ko \
            build/guest/module/l4h_modtest.ko \
            build/prebuilt/l4h-root-inject.elf \
            host/target/aarch64-sel4-roottask/debug/l4h-root.elf \
            tools/l4hctl/target/aarch64-unknown-linux-gnu/release/l4hctl
          rm -rf "$stage"
          # Also build the 6 GiB kernel/loader used by run-limits.sh.
          L4H_MEM=6G tools/build-kernel-aarch64.sh
          L4H_MEM=6G tools/build-loader-aarch64.sh
          tar -cf build/prebuilt-aarch64-6g.tar \
            build/sel4-aarch64 \
            build/loader-target/aarch64-unknown-none/release/sel4-kernel-loader
          ls -lh build/prebuilt-aarch64.tar build/prebuilt-aarch64-6g.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: prebuilt-aarch64
          path: |
            build/prebuilt-aarch64.tar
            build/prebuilt-aarch64-6g.tar
          retention-days: 1
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: logs-build-aarch64
          path: |
            build/*.log
            build/*/*.log

