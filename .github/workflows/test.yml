# Build l4h and run its integration tests in QEMU.  KVM serves only as a
# fast CPU (the scripts hide VMX from the machine, as on a cloud VM), so the
# standard GitHub-hosted Linux runners, which expose /dev/kvm, suffice.
# Jobs run in Debian 13 containers, the distribution l4h is developed on;
# tools/ci-setup.sh installs everything else.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # Must match tools/ci-setup.sh (cache key of the Linux tarball).
  LINUX_VERSION: 6.18.58
  L4H_LINUX_CC: ccache gcc
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 2G
  CARGO_TERM_COLOR: always

jobs:
  x86_64:
    name: x86_64 (QEMU/KVM)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    container:
      image: debian:trixie
      options: --device /dev/kvm
    steps:
      - name: Install git
        run: apt-get update -q && apt-get install -y -q --no-install-recommends git ca-certificates
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          submodules: true
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: build/dl
          key: linux-${{ env.LINUX_VERSION }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: .ccache
          key: ccache-x86_64-${{ github.sha }}
          restore-keys: ccache-x86_64-
      - name: Set up
        run: tools/ci-setup.sh x86_64
      - name: Check KVM
        run: |
          test -c /dev/kvm && test -w /dev/kvm
          grep -c ^processor /proc/cpuinfo; free -g
      - name: Host version metadata
        run: tests/run-versiontest.sh
      - name: Host unit tests (allocator, I/O pool, display)
        run: tests/run-alloctest.sh
      - name: Build seL4
        run: tools/build-kernel.sh
      - name: CPU topology and migration policy
        run: tests/run-schedtest.sh
      - name: Build Linux
        run: tools/build-linux.sh vmlinux && ccache -s
      - name: Guest ABI and seL4 extensions (module), module tree
        run: tests/run-abitest.sh
      - name: Linux self-test, 1 vCPU
        run: tests/run-selftest.sh 1
      - name: Linux self-test, 4 vCPUs
        run: tests/run-selftest.sh 4
      - name: Guest RAM blocks (conversion, smp_mm_stress, OOM)
        run: tests/run-objtest.sh
      - name: BPF JIT
        run: tests/run-bpftest.sh
      - name: Android kernel features
        run: tests/run-androidtest.sh
      - name: Display (virtio-gpu)
        run: tests/run-gputest.sh
      - name: Block pass-through (virtio-blk)
        run: tests/run-blktest.sh
      - name: Block pass-through (NVMe)
        run: BLKTEST_DEV=nvme tests/run-blktest.sh
      - name: Control API
        run: tests/run-ctltest.sh
      - name: Network
        run: tests/run-nettest.sh
      - name: Intel VT-d DMA and interrupt remapping
        run: tests/run-vtdtest.sh --qemu
      - name: AMD-Vi shared PCI requester groups
        run: |
          python3 tests/vtd-net-qemu.py --iommu amd --topology pci
          python3 tests/vtd-net-qemu.py --iommu amd --topology pci --no-intremap
          python3 tests/vtd-net-qemu.py --iommu amd --topology pci --controllers 17
          python3 tests/amdvi-qemu.py
      - name: dom0 restart, CPU caps, steal time
        run: tests/run-m6test.sh
      - name: SMT discovery, placement and migration
        run: tests/run-smttest.sh
      - name: Resource limits
        run: tests/run-limits.sh
      - name: Guest memory overhead and lifecycle latency
        run: |
          tests/run-vmbench.sh | tee build/vmbench.txt
          { echo '### Guest memory overhead and lifecycle latency'; echo '```';
            sed 's/^VMBENCH: //' build/vmbench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Serial monitor
        run: tests/run-monitor.sh
      - name: UEFI boot image
        run: tests/run-uefitest.sh
      - name: Attestation (software TPM)
        run: tests/run-attesttest.sh
      - name: Virtqueue fuzzing
        run: tests/run-fuzz.sh
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: logs-x86_64
          path: |
            build/*.log
            build/*/*.log

  debian:
    name: Debian guests (QEMU/KVM)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    container:
      image: debian:trixie
      # debootstrap mounts filesystems in its chroot.  The runner VM is
      # discarded after the job, so this exposes nothing beyond it.
      options: --privileged
    steps:
      - name: Install git
        run: apt-get update -q && apt-get install -y -q --no-install-recommends git ca-certificates
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          submodules: true
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: build/dl
          key: linux-${{ env.LINUX_VERSION }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: .ccache
          key: ccache-debian-${{ github.sha }}
          restore-keys: |
            ccache-debian-
            ccache-x86_64-
      - name: Set up
        run: tools/ci-setup.sh x86_64 debian
      - name: Check KVM
        run: test -c /dev/kvm && test -w /dev/kvm
      - name: Build seL4
        run: tools/build-kernel.sh
      - name: Build Linux
        run: tools/build-linux.sh vmlinux
      - name: Build the Debian image
        run: tests/mkdebian.sh
      - name: Debian with systemd
        run: tests/run-debian.sh
      - name: NAT router VM
        run: tests/run-router.sh
      - name: Workload (fio verify, parallel build, fsck, reboot)
        run: tests/run-workload.sh
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: logs-debian
          path: |
            build/*.log
            build/*/*.log

  aarch64:
    name: aarch64 (QEMU/TCG)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: debian:trixie
    env:
      L4H_ARCH: aarch64
      L4H_LINUX_CC: ccache aarch64-linux-gnu-gcc
      L4H_TEST_TIMEOUT: 600
      NETTEST_TIMEOUT: 600
      CTLTEST_TIMEOUT: 1800
    steps:
      - name: Install git
        run: apt-get update -q && apt-get install -y -q --no-install-recommends git ca-certificates
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: true
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: build/dl
          key: linux-${{ env.LINUX_VERSION }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .ccache
          key: ccache-aarch64-${{ github.sha }}
          restore-keys: ccache-aarch64-
      - name: Set up
        run: tools/ci-setup.sh aarch64
      - name: Build seL4 and loader
        run: tools/build-kernel-aarch64.sh && tools/build-loader-aarch64.sh
      - name: Build Linux
        run: tools/build-linux.sh vmlinux
      - name: Guest ABI and PCI (EL1)
        run: tests/run-abitest.sh
      - name: Guest ABI (EL2 entry)
        run: L4H_QEMU_VIRTUALIZATION=on tests/run-abitest.sh
      - name: Linux self-test, 1 vCPU
        run: tests/run-selftest.sh 1
      - name: Linux self-test, 4 vCPUs
        run: tests/run-selftest.sh 4
      - name: Kernel modules
        run: tests/run-modtest.sh
      - name: BPF JIT
        run: tests/run-bpftest.sh
      - name: BPF JIT (LSE atomics)
        run: L4H_QEMU_CPU=max tests/run-bpftest.sh
      - name: Android kernel features
        run: tests/run-androidtest.sh
      - name: Display (virtio-gpu)
        run: tests/run-gputest.sh
      - name: Block pass-through (virtio-blk and NVMe)
        run: tests/run-blktest.sh && BLKTEST_DEV=nvme tests/run-blktest.sh
      - name: Control API
        run: tests/run-ctltest.sh
      - name: Network
        run: tests/run-nettest.sh
      - name: Serial monitor
        run: tests/run-monitor.sh
      - name: CPU caps, steal time and dom0 restart
        run: tests/run-m6test.sh
      - name: Resource limits
        run: tests/run-limits.sh
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: logs-aarch64
          path: |
            build/*.log
            build/*/*.log
